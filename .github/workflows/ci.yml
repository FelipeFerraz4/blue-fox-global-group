name: CI Global Group

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar dependências (CI safe)
        run: npm ci

      - name: Audit de produção (falha em high ou critical)
        run: npm run audit:prod

      - name: Rodar testes
        run: npm run test:ci

      - name: Build do projeto
        run: npm run build
